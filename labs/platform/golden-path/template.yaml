# Topic 14.1: the "golden path" for a new ITL service, as a Backstage software template. A developer fills in a form;
# Backstage creates a repository from ./skeleton with everything a production service needs, and registers it in the
# catalog. Register this file in your Backstage (catalog.locations) to see it under "Create".
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: itl-service
  title: ITL service on Kubernetes (GitOps, SLOs, CI)
  description: A new HTTP service with a Kubernetes deployment, an Argo CD application, CI, a catalog entry and an SLO document
  tags: [recommended, kubernetes, gitops]
spec:
  owner: group:platform-team
  type: service
  parameters:
    - title: About the service
      required: [name, owner, description]
      properties:
        name:
          title: Name
          type: string
          description: Lowercase letters, digits and dashes, for example orders-api
          pattern: '^[a-z][a-z0-9-]{2,30}$'
        description:
          title: What it does
          type: string
        owner:
          title: Owning team
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
    - title: Where it runs
      required: [cloud, repoUrl]
      properties:
        cloud:
          title: First cloud
          type: string
          enum: [aws, azure, gcp]
          enumNames: [AWS (EKS), Azure (AKS), Google Cloud (GKE)]
        repoUrl:
          title: Repository
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts: [github.com]
  steps:
    - id: fetch
      name: Create the files from the skeleton
      action: fetch:template
      input:
        url: ./skeleton
        # GitHub Actions also uses ${{ }}: copy workflows as they are, or Backstage would try to fill them in
        copyWithoutTemplating:
          - .github/workflows/*
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          cloud: ${{ parameters.cloud }}
          repoOwner: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
    - id: publish
      name: Create the GitHub repository
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: private
    - id: register
      name: Add it to the catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in the catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
