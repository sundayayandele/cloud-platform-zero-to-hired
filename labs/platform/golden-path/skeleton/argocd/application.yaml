apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${{ values.name }}-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/${{ values.repoOwner }}/${{ values.name }}.git
    targetRevision: main
    path: deploy/overlays/dev
  destination:
    name: dev-${{ values.cloud }} # the dev cluster on the chosen cloud, registered in the platform's Argo CD (topic 12.3)
    namespace: ${{ values.name }}-dev
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
