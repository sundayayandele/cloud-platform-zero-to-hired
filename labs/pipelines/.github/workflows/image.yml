# Topic 8.2: build once, scan, produce an SBOM, push to GHCR, and sign the image keylessly with cosign.
name: image
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to GHCR with the built-in token
      id-token: write # keyless signing with cosign (OIDC)
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/itlpay-lite
    steps:
      - uses: actions/checkout@v4

      - name: Tags from the commit and, for releases, the version
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}

      - uses: docker/setup-buildx-action@v3

      - name: Build (load locally for scanning; nothing pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: itlpay-lite:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan, and fail on HIGH or CRITICAL vulnerabilities that have a fix
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: itlpay-lite:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: itlpay-lite:scan
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the scanned image
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'

      - name: Sign the image and attach the SBOM, keylessly (no keys to store)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${IMAGE}@${DIGEST}"

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
