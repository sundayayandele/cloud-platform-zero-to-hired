{{- if .Values.metrics.serviceMonitor.enabled }}
# Topic 11.1: tells the Prometheus Operator to scrape /metrics on every ITL Pay pod
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "itlpay.fullname" . }}
  labels:
    {{- include "itlpay.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  jobLabel: app.kubernetes.io/name   # the "job" label in Prometheus becomes "itlpay"
  selector:
    matchLabels:
      {{- include "itlpay.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
