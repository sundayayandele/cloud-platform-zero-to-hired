apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "itlpay.fullname" . }}
  labels:
    {{- include "itlpay.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "itlpay.selectorLabels" . | nindent 6 }}
