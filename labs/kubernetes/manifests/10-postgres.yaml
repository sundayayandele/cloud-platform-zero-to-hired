# Topic 9.3: PostgreSQL as a StatefulSet with its own disk, FOR THE LAB ONLY.
# On EKS, AKS and GKE, ITL Pay uses the managed database from topic 6.7 (RDS, Azure Database for PostgreSQL, Cloud SQL).
# Create the password first (never commit it):
#   kubectl -n itlpay create secret generic postgres --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 16)"
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: itlpay
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None # headless: a stable DNS name, postgres-0.postgres
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: itlpay
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # the postgres user in the alpine image
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_DB
              value: itlpay
            - name: POSTGRES_USER
              value: itlpay
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              # over TCP, like the API: on first start the image runs a socket-only server while it initialises
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "itlpay", "-d", "itlpay"]
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates: # one disk per replica, kept when the pod is replaced
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
