# Topic 9.2: traffic from outside with the Gateway API (the successor to Ingress).
# The platform team owns the Gateway (one per cluster, with TLS); each application owns its HTTPRoute.
# gatewayClassName depends on the cloud: see topic 9.5 and labs/kubernetes/values/.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: itlpay
  namespace: itlpay
spec:
  parentRefs:
    - name: public
      namespace: gateway
  hostnames:
    - itlpay.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: itlpay
          port: 80
