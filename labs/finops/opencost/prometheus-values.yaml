# Topic 16.1: a small Prometheus for OpenCost (the community "prometheus" chart, with kube-state-metrics), as in
# OpenCost's documentation, scraping more often so the lab shows costs within minutes.
#   helm upgrade --install prometheus prometheus-community/prometheus --version 29.38.0 -n prometheus-system --create-namespace -f prometheus-values.yaml
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
server:
  global:
    scrape_interval: 15s
  persistentVolume:
    enabled: false
extraScrapeConfigs: |
  - job_name: opencost
    honor_labels: true
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: http
    dns_sd_configs:
      - names:
          - opencost.opencost
        type: 'A'
        port: 9003
