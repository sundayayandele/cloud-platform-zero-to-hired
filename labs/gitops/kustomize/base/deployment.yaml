apiVersion: apps/v1
kind: Deployment
metadata:
  name: itlpay
  labels:
    app.kubernetes.io/name: itlpay
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: itlpay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: itlpay
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: itlpay-lite # replaced by each overlay's "images" (topic 12.1)
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: itlpay } # the generated name has a hash suffix; Kustomize rewrites this reference
            - secretRef: { name: itlpay-db }  # from External Secrets (topic 10.2), never in Git
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 3 # /health waits for the database: the 1 s default turned slowness into an outage (topic 13.3)
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
