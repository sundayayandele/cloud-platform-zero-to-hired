# Topic 10.2: the same ExternalSecret on every cluster. It reads the secret "itlpay-dev-database" (JSON with username,
# password, host, port and dbname) from whichever store "cloud" points at, and writes the Kubernetes Secret
# "itlpay-db" with one key, DATABASE_URL, that the Helm chart from topic 9.4 already uses.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: itlpay-db
  namespace: itlpay
spec:
  refreshInterval: 1h # picks up a rotated password within the hour (restart the pods to use it)
  secretStoreRef:
    kind: SecretStore
    name: cloud
  target:
    name: itlpay-db
    creationPolicy: Owner # ESO owns the Secret: deleting the ExternalSecret deletes it
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password | urlquery }}@{{ .host }}:{{ .port }}/{{ .dbname }}"
  dataFrom:
    - extract:
        key: itlpay-dev-database
