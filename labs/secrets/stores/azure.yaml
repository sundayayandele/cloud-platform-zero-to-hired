# AKS: Azure Key Vault with Microsoft Entra Workload ID. ESO signs in as the chart's service account "itlpay"
# (annotated with the managed identity's client ID by labs/kubernetes/values/aks.yaml); that identity has the
# "Key Vault Secrets User" role on this vault only.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: cloud
  namespace: itlpay
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://kv-itlpay-dev.vault.azure.net
      serviceAccountRef:
        name: itlpay
