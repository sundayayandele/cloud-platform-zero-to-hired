# kind and the course's CI: ESO's "fake" provider returns fixed values, so the ExternalSecret can be tested without a
# cloud. kind-external-secrets-test.sh replaces PASSWORD with the lab database's real password before applying it.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: cloud
  namespace: itlpay
spec:
  provider:
    fake:
      data:
        - key: itlpay-dev-database
          value: '{"username": "itlpay", "password": "PASSWORD", "host": "postgres", "port": "5432", "dbname": "itlpay"}'
