# GKE: Google Secret Manager with Workload Identity Federation for GKE. ESO signs in as the chart's service account
# "itlpay", whose principal has roles/secretmanager.secretAccessor on this secret only.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: cloud
  namespace: itlpay
spec:
  provider:
    gcpsm:
      projectID: PROJECT_ID
      auth:
        workloadIdentity:
          serviceAccountRef:
            name: itlpay
