# EKS: AWS Secrets Manager in af-south-1. The ESO controller has its own identity (EKS Pod Identity on the service
# account external-secrets/external-secrets) that may only assume per-application roles; this store assumes the role
# that can read itlpay's secrets and nothing else.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: cloud
  namespace: itlpay
spec:
  provider:
    aws:
      service: SecretsManager
      region: af-south-1
      role: arn:aws:iam::<account>:role/itlpay-dev-secrets-read
