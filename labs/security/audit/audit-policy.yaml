# Topic 15.2: what the Kubernetes API server records. Rules are checked in order; the first match wins.
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages: [RequestReceived] # one entry per request, when it completes
rules:
  # Secrets and tokens: who touched which one, when, and the result, but NEVER the contents
  - level: Metadata
    resources:
      - group: ""
        resources: [secrets, serviceaccounts/token]
  # Changes to who-can-do-what: the full request and response, for investigations
  - level: RequestResponse
    verbs: [create, update, patch, delete]
    resources:
      - group: rbac.authorization.k8s.io
        resources: [roles, rolebindings, clusterroles, clusterrolebindings]
  # Very noisy and rarely useful
  - level: None
    resources:
      - group: ""
        resources: [events, endpoints]
      - group: coordination.k8s.io
        resources: [leases]
      - group: discovery.k8s.io
        resources: [endpointslices]
  - level: None
    users: ["system:kube-proxy"]
  - level: None
    nonResourceURLs: ["/healthz*", "/livez*", "/readyz*", "/version", "/metrics"]
  # Everything else: who did what to which object, without bodies
  - level: Metadata
