# Topic 13.3: Chaos Mesh for kind (and AKS, which also uses containerd):
#   helm upgrade --install chaos-mesh chaos-mesh/chaos-mesh --version 2.8.6 -n chaos-mesh --create-namespace -f chaos-mesh-values.yaml
chaosDaemon:
  runtime: containerd
  socketPath: /run/containerd/containerd.sock
dashboard:
  create: false # use the experiment files and kubectl; turn the dashboard on to explore (with its RBAC token)
