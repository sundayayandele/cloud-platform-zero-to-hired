# Topic 13.4: Velero for the lab, backing up to the SeaweedFS store above:
#   helm upgrade --install velero vmware-tanzu/velero --version 12.2.1 -n velero --create-namespace -f velero-values.yaml
# On EKS, AKS and GKE: the provider's plugin (aws, microsoft-azure, gcp), a bucket or container in the cloud, and the
# cloud's workload identity (topic 9.5) instead of credentials.
image:
  tag: v1.18.4
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.14.4
    volumeMounts:
      - { mountPath: /target, name: plugins }
configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: velero
      default: true
      config:
        region: us-east-1
        s3ForcePathStyle: "true"
        s3Url: http://seaweedfs.backup.svc:8333
  volumeSnapshotLocation: []
  uploaderType: kopia
snapshotsEnabled: false # kind has no disk snapshots: volumes are copied file by file (file system backup)
deployNodeAgent: true # runs on every node and copies volume data for file system backups
credentials:
  secretContents:
    cloud: |
      [default]
      aws_access_key_id=velero
      aws_secret_access_key=velero-lab-only
